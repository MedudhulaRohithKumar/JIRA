<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080f0" />
      <stop offset="100%" stop-color="#005bab" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Jira / CSR Geometric Diamond Icon ❖ -->
  <g filter="url(#glow)">
    <!-- Top Diamond -->
    <path d="M16 6 L20 11 L16 14 L12 11 Z" fill="#ffffff" opacity="0.95" />
    <!-- Bottom Diamond -->
    <path d="M16 26 L12 21 L16 18 L20 21 Z" fill="#ffffff" opacity="0.95" />
    <!-- Left Diamond -->
    <path d="M6 16 L11 12 L14 16 L11 20 Z" fill="#ffffff" opacity="0.9" />
    <!-- Right Diamond -->
    <path d="M26 16 L21 20 L18 16 L21 12 Z" fill="#ffffff" opacity="0.9" />
    <!-- Center Node Core -->
    <circle cx="16" cy="16" r="2.2" fill="#ffffff" />
  </g>
</svg>
